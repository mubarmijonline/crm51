  <!-- Custom fonts for this template-->

  <!-- Custom styles for this template-->

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

	<script src="{{ url_for('static', filename='sweetalert/dist/sweetalert2.all.min.js') }}"></script>
	<script src="{{ url_for('static', filename='sweetalert/dist/sweetalert2.min.js') }}"></script>

  <link href="{{ url_for('static', filename='css/frontend/moving_lines.css') }}" rel="stylesheet">

  <script src="{{url_for('static', filename='js/ps_calc_js/forgot_pass.js')}}"></script>


</head>

<body class="bg-dark">


  <div class="container">

    <!-- Outer Row -->
    <div class="row justify-content-center">

      <div class="col-xl-10 col-lg-12 col-md-9">

        <div class="card o-hidden border-0 shadow-lg my-5">
          <div class="card-body p-0">
            <!-- Nested Row within Card Body -->
            <div class="row">
              <div class="col-lg-6 d-none d-lg-block"> 

                <img src="{{ url_for('static', filename='images/51_Logo.png') }}" style="width: 115%; height: 100%;">
                

              </div>

              <div class="col-lg-6">
                <div class="p-5">
                  <div class="text-center">
                    <h1 class="h4 text-gray-900 mb-4">Hello</h1>
                    <h1 class="h4 text-gray-900 mb-4">Wanna Sign-in?</h1>
                    <div id="myAlert" class="alert alert-light" style="color: red; font-size: 13px;">{{error}}</div>
                  </div>
                  <form class="user" action="" method="POST">
                    <div class="form-group">
                      <!-- <label style="color:midnightblue;font-weight:bold;">&nbsp;&nbsp;&nbsp;Mobile or E-Mail</label> -->
                      <label style="color:blue;font-size: 14px;font-weight: bold;">&nbsp;&nbsp;&nbsp;&nbsp;Username</label>
                      <input type="text" class="form-control" placeholder="Enter Your Name..." name="username" id="username" value="{{request.form.username}}" required>
                    </div>
                    <div class="form-group">
                      <label style="color:blue;font-size: 14px;font-weight: bold;">&nbsp;&nbsp;&nbsp;&nbsp;Password</label>
                      <input type="password" class="form-control" id="exampleInputPassword" placeholder="Password" name="password" minlength="8" value="{{request.form.password}}" required>
                      <div id="myAlert" class="alert alert-light" style="color: red; font-size: 13px;">{{error1}}</div>
                    </div>
                    
                    <input type="submit" id="login" class="btn btn-success btn-user btn-block" value="login">
                    <hr>

                    <hr>


                  </form>


              </div>


              </div>
            </div>
          </div>
        </div>

      </div>

    </div>

  </div>

  <footer class="bg-light text-center text-lg-start">
    
		  <!-- Copyright -->
		  <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.2);">
