<style>
  body {
    font: 90%/1.45em "Helvetica Neue", HelveticaNeue, Verdana, Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
    background-color: #f2f3f7;
  }


  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap');




  ::selection {
    color: #fff;
    background: #664AFF;
  }

  .containerss {
    max-width: 600px;
    width: 500px;
    margin: 30px auto;
  }

  .containerss .searchInput {
    background: #fff;
    width: 100%;
    border-radius: 5px;
    position: relative;
    box-shadow: 0px 1px 5px 3px rgba(0, 0, 0, 0.12);
  }

  .searchInput input {
    height: 55px;
    width: 100%;
    outline: none;
    border: none;
    border-radius: 5px;
    padding: 0 60px 0 20px;
    font-size: 18px;
    box-shadow: 0px 1px 5px rgba(0, 0, 0, 0.1);
  }

  .searchInput.active input {
    border-radius: 5px 5px 0 0;
  }

  .searchInput .resultBox {
    padding: 0;
    opacity: 0;
    pointer-events: none;
    max-height: 280px;
    overflow-y: auto;
  }

  .searchInput.active .resultBox {
    padding: 10px 8px;
    opacity: 1;
    pointer-events: auto;
  }

  .resultBox li {
    list-style: none;
    padding: 8px 12px;
    display: none;
    width: 100%;
    cursor: default;
    border-radius: 3px;
  }

  .searchInput.active .resultBox li {
    display: block;
  }

  .resultBox li:hover {
    background: #efefef;
  }

  .searchInput .icon {
    position: absolute;
    right: 0px;
    top: 0px;
    height: 55px;
    width: 55px;
    text-align: center;
    line-height: 55px;
    font-size: 20px;
    color: maroon;
    cursor: pointer;
  }


  .switch {
    position: relative;
    display: inline-block;
    width: 60px;
    height: 34px;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    -webkit-transition: .4s;
    transition: .4s;
  }

  .slider:before {
    position: absolute;
    content: "";
    height: 26px;
    width: 26px;
    left: 4px;
    bottom: 4px;
    background-color: white;
    -webkit-transition: .4s;
    transition: .4s;
  }

  input:checked+.slider {
    background-color: #2196F3;
  }

  input:focus+.slider {
    box-shadow: 0 0 1px #2196F3;
  }

  input:checked+.slider:before {
    -webkit-transform: translateX(26px);
    -ms-transform: translateX(26px);
    transform: translateX(26px);
  }

  /* Rounded sliders */
  .slider.round {
    border-radius: 34px;
  }

  .slider.round:before {
    border-radius: 50%;
  }
</style>

<script>
  function add_item()
  {

    var halto = 0;
    if (check_list_item_name == '')
    {
      Swal.fire(
                    'Empty',
                    'Please entry item first...',
                    'info');
                    return;
    }

    [...document.getElementsByClassName('item_in_checklist')].forEach(el => {
    // Do something with each element
      
            if(el.value.toString().toUpperCase() == check_list_item_name.toString().toUpperCase())
            {
                          Swal.fire(
                            'Duplicate',
                            'Item already exists in checklist...',
                            'info');
                            halto = 1;                        
            }
    });


      if(halto == 1)
      {
        return;
      }

    check_list_item_name = document.getElementById("check_list_item_name").value;

    var check_list_div = document.getElementById("check_list_div");
             
             //var checkbox_div = document.createElement('div');
             //checkbox_div.className = "form-check";

             // creating checkbox element
             var checkbox = document.createElement('input');
             var checkbox_hidden = document.createElement('input');

             // Assigning the attributes
             // to created checkbox
             // checkbox.type = "checkbox";
             checkbox.name = "check_box";
             checkbox.value = check_list_item_name;

             checkbox.id = "id_"+check_list_item_name;
             checkbox.className  = "form-check-input";
             checkbox.readOnly = 'true';
             checkbox.style="background-color:white;boarder:none";
             checkbox.type="checkbox";

              // Hidden
             checkbox_hidden.id = "hidden_id_"+check_list_item_name;
             checkbox_hidden.name = "check_box_hidden";
             checkbox_hidden.value = check_list_item_name;
             
             checkbox_hidden.className  = "form-check-input";
             checkbox_hidden.readOnly = 'true';
             checkbox_hidden.style="background-color:white;boarder:none";
             checkbox_hidden.type="hidden";
              
             // creating label for checkbox
             var label = document.createElement('label');
              
             // assigning attributes for 
             // the created label tag 
             label.htmlFor = "id_"+check_list_item_name;
              
             // appending the created text to 
             // the created label tag 
             label.appendChild(document.createTextNode(check_list_item_name));
             label.className = "form-check-label";
             label.id =  "label_id_"+check_list_item_name;

             // appending the checkbox
             // and label to div
             
             check_list_div.appendChild(checkbox_hidden);
             check_list_div.appendChild(checkbox);
             check_list_div.appendChild(label);

             var cancel_item = document.createElement('button');
             cancel_item.id = "btn_id_"+check_list_item_name;
             cancel_item.type = "button";
             cancel_item.className = "btn btn-md btn-danger";
             cancel_item.setAttribute("onclick","remove_item('id_"+check_list_item_name+"')");
             cancel_item.setAttribute("style", "margin-left:1rem;")


             check_list_div.appendChild(cancel_item);

             var br = document.createElement('br');
             br.id = "br_id_"+check_list_item_name;
             check_list_div.appendChild(br);

             document.getElementById("check_list_item_name").value = "";
             //$("#add_item_modal #close").click();
  }

  function remove_item(item_id)
  {
    document.getElementById(item_id).remove();
    document.getElementById('hidden_'+item_id).remove();
    document.getElementById('btn_'+item_id).remove();
    document.getElementById('label_'+item_id).remove();
    document.getElementById('br_'+item_id).remove();
  }
</script>

  <script>

    function get_notes(id) {

      $('#notes_table').DataTable().destroy();
      var table = $('#notes_table').DataTable({
        ajax: { url: '/get_events_notes?id=' + id, mimeType: 'json' },
        deferRender: true,
        columns: [
          { data: '_id', "visible": false },
          {
            mRender: function (data, type, row) {
              mynotes = row.notes
              const matches = mynotes.match(/\r\n|\n\r|\n|\r/g);
              const count = matches ? matches.length + 1 : 1;
              return '<textarea id="mytextarea' + row._id + '" rows="' + count + '" class="form-control" width="100%" height="auto" readonly style="boarder:none;background-color:white;position: relative;border: 1px solid #888;background: #fff;" contenteditable>' + row.notes + '</textarea>'
            },
          },
          { data: 'added_by' },
          { data: 'added_date' },
        ],


        rowId: 'extn',
        select: true,
        paging: false,
        dom: 'Bfrtip',
        scrollX: true,
        select: false,
        "order": [[0, "desc"]],
        buttons: [

          {
            text: 'Refresh',

            action: function () {
              table.ajax.reload();
            }
          }
        ]

      });


    }

  </script>

      input.onkeyup = (e) => {
        let userData = e.target.value; //user enetered data
        let emptyArray = [];
        if (userData) {
          emptyArray = suggestions.filter((data) => {
            //filtering array value and user characters to lowercase and return only those words which are start with user enetered chars
            return data.toLocaleLowerCase().includes(userData.toLocaleLowerCase());
          });
          emptyArray = emptyArray.map((data) => {
            // passing return data inside li tag
            return data = '<li>' + data + '</li>';
          });
          searchInput.classList.add("active"); //show autocomplete box
          showSuggestions(emptyArray);
          let allList = resultBox.querySelectorAll("li");
          for (let i = 0; i < allList.length; i++) {
            //adding onclick attribute in all li tag
            allList[i].setAttribute("onclick", "get_data(this.innerHTML)");

          }
        } else {
          searchInput.classList.remove("active"); //hide autocomplete box
        }
      }
      function showSuggestions(list) {
        let listData;

        if (!list.length) {
          userValue = input.value; //inputBox
          listData = '<li>' + userValue + '</li>';
        } else {
          listData = list.join('');
        }
        resultBox.innerHTML = listData;
      }



    });

  </script>

  <script>
    function get_data(selected_value) {

      if (selected_value === "") {
        return;
      }

      url = '/get_event_lead_data?selected_data=' + selected_value
      $.post(url).done(function (response) {

        update_response = response[0]
        assignation_response = response[1]
        check_list = response[2]

        response = update_response
        const searchInput = document.querySelector(".searchInput");
        searchInput.classList.remove("active"); // hide search bar
        document.getElementById('seacrch_input_box').value = selected_value
        document.getElementById('update_section').style = 'display: block;';
        document.getElementById('client_id').value = response.client_id;
        document.getElementById('clien_id_file_upload').value = response.client_id; // IN file Upload Modal
        document.getElementById('added_date').value = response.added_date;
        document.getElementById('client_mobile').value = response.client_mobile;
        document.getElementById('client_name').value = response.client_name;

        document.getElementById('email').value = response.client_email;

        document.getElementById('client_deposit_flag').value = response.client_deposit_flag;
        document.getElementById('client_deposit').value = response.client_deposit;
        document.getElementById('client_remaining').value = response.client_remaining;
        document.getElementById('client_total').value = response.client_total;
        deposit_change(response.client_deposit_flag); // Update flag

        document.getElementById('status').value = response.status;

        document.getElementById('temperature').value = response.temperature;

        document.getElementById('client_payment_status').value = response.client_payment_status;
        
        if (response.status == 'pending' || response.status == 'not_contacted') {
          check_status();
          document.getElementById('recall_date').value = response.recall_date;
          //$('#recall_date').datepicker("setDate", response.recall_date);
        }
        else if (response.status == 'not_interested')
        {
          check_status();
          document.getElementById('not_interested_notes').value = response.client_not_interested_notes;
        }

        document.getElementById('assets_list').value = response.client_assets_list;

        document.getElementById('notes').value = '';

        assignation = assignation_response.username_assignation;
        myrole = "{{session['role']}}";
        get_assignation(assignation, myrole);
        get_notes(response.client_id);

        get_client_file();

        // Build Check List //
        var check_list_div = document.getElementById("check_list_div");

        for(i=0;i<check_list.length;i++)
        {
        check_list_item_name = check_list[i].item;
        item_state = check_list[i].checked;


             // creating checkbox element
             var checkbox = document.createElement('input');
             var checkbox_hidden = document.createElement('input');

             // Assigning the attributes
             // to created checkbox
             checkbox.name = "check_box";
             checkbox.value = check_list_item_name;

             checkbox.id = "id_"+check_list_item_name;
             checkbox.className  = "form-check-input";
             checkbox.readOnly = 'true';
             checkbox.style="background-color:white;boarder:none";
             checkbox.type="checkbox";
             if(item_state == 1)
             {
              checkbox.checked = true;
             }
             else{
              checkbox.checked = false;
             }

              // Hidden
             checkbox_hidden.id = "hidden_id_"+check_list_item_name;
             checkbox_hidden.name = "check_box_hidden";
             checkbox_hidden.value = check_list_item_name;
             
             checkbox_hidden.className  = "form-check-input";
             checkbox_hidden.readOnly = 'true';
             checkbox_hidden.style="background-color:white;boarder:none";
             checkbox_hidden.type="hidden";
              
             // creating label for checkbox
             var label = document.createElement('label');
              
             // assigning attributes for 
             // the created label tag 
             label.htmlFor = "id_"+check_list_item_name;
              
             // appending the created text to 
             // the created label tag 
             label.appendChild(document.createTextNode(check_list_item_name));
             label.className = "form-check-label";
             label.id = "label_id_"+check_list_item_name;

             // appending the checkbox
             // and label to div
                          
             check_list_div.appendChild(checkbox_hidden);
             check_list_div.appendChild(checkbox);
             check_list_div.appendChild(label);

             cancel_item = document.createElement('button');
             cancel_item.id = "btn_id_"+check_list_item_name;
             cancel_item.type = "button";
             cancel_item.className = "btn btn-md btn-danger";
             cancel_item.setAttribute("onclick","remove_item('id_"+check_list_item_name+"')");
             cancel_item.setAttribute("style", "margin-left:1rem;")

             check_list_div.appendChild(cancel_item);
             var br = document.createElement('br');
             br.id = "br_id_"+check_list_item_name;
             check_list_div.appendChild(br);

        }

      });
    }

  </script>


  <script>
    function get_assignation(username_from_query, user_role) {

      let dropdown = $('#assigned_to');

      dropdown.empty()
      const url = '/users?get_select_users_event';


      user_role = "{{session['role']}}"
      current_username = "{{session['name']}}"

      user_list = []
      // Populate dropdown with list of provinces
      $.getJSON(url, function (data) {
        $.each(data, function (key, entry) {




          if (user_role == 'admin') {

            if (username_from_query.includes(entry.username)) {

              dropdown.append($('<option selected="true"></option>').attr('value', entry.abbreviation).text(entry.username));
              user_list.push(entry.username)
            }
            else {

              dropdown.append($('<option></option>').attr('value', entry.abbreviation).text(entry.username));
            }
          }
          else {

            if (username_from_query.includes(entry.username)) {

              user_list.push(entry.username)

              dropdown.append($('<option disabled selected="true"></option>').attr('value', entry.abbreviation).text(entry.username));


            }
            else {

              dropdown.append($('<option disabled></option>').attr('value', entry.abbreviation).text(entry.username));
            }
          }

        else

          $('#assigned_to').select2({ placeholder: 'Multi Assignation', closeOnSelect: false, allowClear: false,disabled:'readonly' });
         
          
        }

      });



    }

		  $.ajax({
  
		xhr: function() {
				  var xhr = new window.XMLHttpRequest();
				  xhr.upload.addEventListener("progress", function(evt) {
					  if (evt.lengthComputable) {
						  var percentComplete = parseInt( ((evt.loaded / evt.total) * 100) );
						  $(".progress-bar").width(percentComplete + '%');
						  $(".progress-bar").html(percentComplete+'%');
					  }
				  }, false);
				  return xhr;
			  },
  
			  type: 'POST',
			  url: '/upload_file_event',
			  data: form_data,
			  contentType: false,
			  cache: false,
			  processData: false,
