{% extends 'main.html' %}
{% block body %}



<body onload="get_clients_data()">
    

  <div  style="margin-left: 2%;margin-right: 2%;">
  <div class="card_customized">
    <table id="clients_table" class="display" style="width:100%">

      <br>
      <h1 style="font-family: 'Trebuchet MS', sans-serif;text-align: center;color:tomato"><u>Clients Database</u></h1>

      <div>
      <div style="float:right"><a  data-toggle="modal" data-target="#add_client_modal">&nbsp;&nbsp;<i class="fa-solid fa-plus fa-3x" title="Add Client"></i></a></div>
    </div>
      <br> 
      <br> 
      <br>  
      <hr>
        <thead>

            <tr>
                <th>ID</th>
                <th>Client Name</th>
                <th>الاسم</th>
                <th style="width: 8%;">Mobile</th>
                <th>Email</th>
                <th>Added_by</th>
                <th>Added Date</th>
                <th></th>
            </tr>

        </thead>
        <tfoot>

          <tr>
            <th>ID</th>
            <th>Client Name</th>
            <th>الاسم</th>
            <th style="width: 8%;">Mobile</th>
            <th>Email</th>
            <th>Added_by</th>
            <th>Added Date</th>
            <th></th>
        </tr>
        </tfoot>
    </table>

  </div>
</div>

    <script>

        function get_clients_data() {


            var table = $('#clients_table').DataTable({
                ajax: { url: '/get_client_DB_data', mimeType: 'json' },
                deferRender: true,
                columns: [
                    { data: 'client_id' },
                    { data: 'name_english' },
                    { data: 'name_arabic' },
                    { data: 'mobile' },
                    { data: 'email' },
                    { data: 'added_by' },
                    { data: 'date' },
                    
                    {
                        mRender: function (data, type, row) {

                            return '<div class="btn-group"> <button data-toggle="modal" data-target="#edit_client_modal"  name="edit_client" class="btn btn-primary" onclick="edit_client('+row.client_id+',\''+row.name_english+'\',\''+row.email+'\',\''+row.name_arabic+'\',\''+row.mobile+'\')">Edit</button> <button  id="delete" type="button" class="btn btn-danger btn-xs dt-delete" onclick="delete_client('+row.client_id+')"><span class="glyphicon glyphicon-remove glyphicon-trash" aria-hidden="true"></span>Delete</button></div>'

                        },
                    }

                ],


                rowId: 'extn',
                select: true,
                paging: false,
                dom: 'Bfrtip',
                scrollX: false,   // see crm-table.js: a split header breaks the pinned column
                select: false,
                "order": [[0, "desc"]],
                buttons: [
                    'copy', 'csv', 'excel', 'pdf', 'print',
                    {
                        text: 'Reload table',
                        exportOptions: {
                            columns: [0, 1, 2]
                        },
                        action: function () {
                            table.ajax.reload();
                        }
                    }
                ]

            });


        }

    </script>


<!-- Edit Client Modal -->
<!-- Modal -->
<div class="modal fade" id="edit_client_modal" tabindex="-1" role="dialog" aria-labelledby="edit_client_modal_Title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-md" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLongTitle" style="font-family: Trebuchet MS, sans-serif;color:tomato;font-weight:bold;">Edit Client</h5>
          <button type="button" id='edit_close' class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
            <!-- MODAL BODY -->
  
          <div class="user">
            
            <input type="hidden" id="client_id" name="client_id" value="0">

            <div class="form-group">
              <label for="name_english" maxlength="14" style="font-family: Trebuchet MS, sans-serif;color:black;font-weight:bold;">Client Mobile</label>
              <input type="text" class="form-control" name="client_mobile" id="client_mobile" required>
            </div>

            <div class="form-group">
              <label for="name_english" maxlength="125" style="font-family: Trebuchet MS, sans-serif;color:black;font-weight:bold;">Client Name</label>
              <input type="text" class="form-control" name="name_english" id="name_english" required>
            </div>

            <div class="form-group">
              <label for="name_arabic" maxlength="125" style="font-family: Trebuchet MS, sans-serif;color:black;font-weight:bold;">الاسم</label>
              <input type="text" class="form-control" name="name_arabic" id="name_arabic" required>
            </div>
  
            <div class="form-group">
              <label for="client_email" maxlength="125" style="font-family: Trebuchet MS, sans-serif;color:black;font-weight:bold;">Email</label>
              <input type="text" class="form-control" id="client_email" name="client_email">
            </div>
  

         
            



          </div>
  
            <!-- MODAL BODY -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="button" id="add_new_account_btn" class="btn btn-primary" onclick="update_client_data()">Update</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Edit Client Modal -->



  <!-- Add Client Modal -->
<!-- Modal -->
<form id="add_client_form" name="add_client_form" >
<div class="modal fade" id="add_client_modal" tabindex="-1" role="dialog" aria-labelledby="add_client_modal_Title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-md" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLongTitle" style="font-family: Trebuchet MS, sans-serif;color:tomato;font-weight:bold;">Add Client to DB</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" id="add_client_close" onclick="document.getElementById('add_client_form').reset()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
          <!-- MODAL BODY -->

        <div class="user">
          
          <div class="form-group">
            <label for="name_english" style="font-family: Trebuchet MS, sans-serif;color:black;font-weight:bold;">Client Mobile</label>
            <input type="text" maxlength="15" class="form-control" name="mobile1" id="mobile1" required oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" style="font-family: Trebuchet MS, sans-serif;color:navy;font-weight:bold;">
          </div>

          <div class="form-group">
            <label for="name_english" style="font-family: Trebuchet MS, sans-serif;color:black;font-weight:bold;">Client Name</label>
            <input type="text" maxlength="125" class="form-control" name="name_english1" id="name_english1" required style="font-family: Trebuchet MS, sans-serif;color:navy;font-weight:bold;">
          </div>
          
          <div class="form-group">
            <label for="name_arabic" style="font-family: Trebuchet MS, sans-serif;color:black;font-weight:bold;">الاسم</label>
            <input type="text" maxlength="125" class="form-control" name="name_arabic1" id="name_arabic1" required style="font-family: Trebuchet MS, sans-serif;color:navy;font-weight:bold;">
          </div>

          <div class="form-group">
            <label for="client_email" style="font-family: Trebuchet MS, sans-serif;color:black;font-weight:bold;">Email</label>
            <input type="text" maxlength="125" class="form-control" id="client_email1" name="client_email1" style="font-family: Trebuchet MS, sans-serif;color:navy;font-weight:bold;">
          </div>

       
          

          <br>
        </div>

          <!-- MODAL BODY -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
        <button type="submit" id="add_client" class="btn btn-primary" >Save</button>
      </div>
    </div>
  </div>
</div>
</form>

<script>
  $("form#add_client_form").submit(function (e) {
    e.preventDefault();
      var formData = new FormData(this);
      var table = $('#clients_table').DataTable();
      
      $.ajax({
        url: "/add_client_to_db",
        type: 'POST',
        data: formData,
        success: function (data) {
          var state = data.state

          if (state == 'error')
            {
            Swal.fire(
              'Sorry',
              'Something went Wrong',
              'error')
              $("#add_client_close").click();
            }
              

              else if (state == 'mobile_exist') {
            Swal.fire(
              'Sorry',
              'Mobile number is already exist in DB',
              'error')
              table.ajax.reload();

            
            //$.post("/home?get_new_time").done(function (response) { table.ajax.reload(); run_card() });

          }          
          else if (state == 'email_exist') {
            Swal.fire(
              'Sorry',
              'Email is already exist in DB',
              'error')
              table.ajax.reload();

            
            //$.post("/home?get_new_time").done(function (response) { table.ajax.reload(); run_card() });

          }  

          else if (state == 'success') {
            Swal.fire(
              'Good Job',
              'Client Added to your DB',
              'success')
              table.ajax.reload();
            $("#add_client_close").click();
            document.getElementById('add_client_form').reset()
            
           
            //$.post("/home?get_new_time").done(function (response) { table.ajax.reload(); run_card() });

          }
        },
        cache: false,
        contentType: false,
        processData: false
      });
    
  });
</script>



  <script>

function edit_client(id, name_english, email, name_arabic, mobile)
{

    console.log(mobile)
    client_name_english = document.getElementById('name_english');
    client_name_arabic = document.getElementById('name_arabic');
    client_email = document.getElementById('client_email');
    client_id = document.getElementById('client_id');
    client_mobile = document.getElementById('client_mobile');

    client_mobile.value=""
    client_name_english.value = "";
    client_email.value = "";
    client_name_arabic.value="";
    client_id.value = "0";



    

    client_id.value = id;
    client_name_english.value = name_english;
    client_name_arabic.value = name_arabic;
    client_mobile.value = mobile;
    if (email == null || email == 'null')
    {
      client_email.value = ""
    }
    else
    {
      client_email.value = email;
    }
    

    
    

    
    //document.getElementById('edit_client_modal').style.display = "block";
    //document.getElementById('edit_client_modal').classNa$me="modal fade show"; 
    //window.$('#edit_client_modal').modal('toggle');
    //document.getElementById("edit_client_modal").showModal(); 
    //$('#edit_client_modal').show()
}

function update_client_data()
{
    client_id = document.getElementById('client_id').value;
    client_name_english = document.getElementById('name_english').value;
    client_email = document.getElementById('client_email').value;
    client_name_arabic=document.getElementById('name_arabic').value;
    client_mobile = document.getElementById('client_mobile').value;

    $.post("/update_client_data", { client_name_english:client_name_english, client_email:client_email, client_name_arabic:client_name_arabic, client_id:client_id, client_mobile:client_mobile }).done(function (response) {

    state = response.state;
    
    if (state == "success") {

    Swal.fire(
        'Done!',
        'Updated...',
        'success');
    $('#clients_table').DataTable().ajax.reload();
    }

    else if (state == "duplicate") {

    Swal.fire(
        'Duplicate Email!',
        'Try another one...',
        'info');
    $('#clients_table').DataTable().ajax.reload();
    }
    else if (state == "mobile_duplicate") {

Swal.fire(
    'Duplicate Mobile!',
    'Try another one...',
    'info');
$('#clients_table').DataTable().ajax.reload();
}

    else if (state == "missing_name") {
    Swal.fire(
        'Client Name is missing',
        'Client must have a name...',
        'info');
    $('#clients_table').DataTable().ajax.reload();
    }

    else {

    Swal.fire(
        'Hmmm',
        'Something went wrong, try again in a few moments',
        'error');
    }
    $('#edit_close').click();
    

    });
}

function delete_client(id)
{

  Swal.fire({
    title: 'Are you sure?',
    text: "You won't be able to revert this!",
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#3085d6',
    cancelButtonColor: '#d33',
    confirmButtonText: 'Yes, delete it!'
  }).then((result) => {
    if (result.isConfirmed) {

      $.post("/delete_client", { client_id:id  }).done(function (response) {
        state = response.state;

        //setTimeout(() => {  window.location.replace("/logout"); }, 3000);

        if (state == "success") {
        
          Swal.fire({
            icon: 'success',
            title: 'Deleted!',
            text: 'Client has been deleted.',
            showConfirmButton: false,
            showCancelButton: false
          });
          $('#clients_table').DataTable().ajax.reload();

      }



        else {
          Swal.fire(
            'Hmmm',
            'Something went wrong, try again in a few moments',
            'error');
        }

      });
    }
  });

}
  </script>





</body>
