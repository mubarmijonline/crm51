.switch {
position: relative;
display: inline-block;
width: 60px;
height: 34px;
}

.switch input { 
opacity: 0;
width: 0;
height: 0;
}

.slider {
position: absolute;
cursor: pointer;
top: 0;
left: 0;
right: 0;
bottom: 0;
background-color: #ccc;
-webkit-transition: .4s;
transition: .4s;
}

.slider:before {
position: absolute;
content: "";
height: 26px;
width: 26px;
left: 4px;
bottom: 4px;
background-color: white;
-webkit-transition: .4s;
transition: .4s;
}

input:checked + .slider {
background-color: #2196F3;
}

input:focus + .slider {
box-shadow: 0 0 1px #2196F3;
}

input:checked + .slider:before {
-webkit-transform: translateX(26px);
-ms-transform: translateX(26px);
transform: translateX(26px);
}

/* Rounded sliders */
.slider.round {
border-radius: 34px;
}

.slider.round:before {
border-radius: 50%;
}

<script>
  $("form#create_crm_form").submit(function (e) {
    e.preventDefault();
    var formData = new FormData(this);


    $.ajax({
      url: "/course_form?add_lead",
      type: 'POST',
      data: formData,
      success: function (data) {
        var state = data.state
        var reason = data.reason
        console.log(state)




        if (state == 'error') {
          Swal.fire(
            'Sorry',
            reason,
            'error')



          //$.post("/home?get_new_time").done(function (response) { table.ajax.reload(); run_card() });

        }
        else if (state == 'course_holded') {
          Swal.fire(
            'Sorry',
            reason,
            'error')



          //$.post("/home?get_new_time").done(function (response) { table.ajax.reload(); run_card() });

        }

        else if (state == 'success') {
          Swal.fire(
            'Thank you',
            'Form Submitted Successfully',
            'success')
          document.getElementById('create_crm_form').reset();
          get_course_data();
          edu_system_data();
        }
        else {
          Swal.fire(
            'Sorry',
            'Something went wrong',
            'error')

          //$("#add_client_close").click();
        }
      },
      cache: false,
      contentType: false,
      processData: false
    });

  });
</script>

<script>
  function edu_system_data(){
  let dropdown = $('#educational_system');
  
  dropdown.empty();
  

  dropdown.append($('<option selected disabled value="">Choose Educational System</option>'))
  const url = '/get_educational_system_data';

  // Populate dropdown with list of provinces
  $.getJSON(url, function (data) {
    $.each(data, function (key, entry) {
      dropdown.append($('<option ></option>').attr('value', entry.abbreviation).text(entry.educational_system));
      
    });
    dropdown.select2();
    
  });
  
}
</script>
