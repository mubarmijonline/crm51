<style>
  body {
    font: 90%/1.45em "Helvetica Neue", HelveticaNeue, Verdana, Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
    background-color: #f2f3f7;
  }


  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap');




  ::selection {
    color: #fff;
    background: #664AFF;
  }

  .containerss {
    max-width: 600px;
    width:500px;
    margin: 30px auto;
  }

  .containerss .searchInput {
    background: #fff;
    width: 100%;
    border-radius: 5px;
    position: relative;
    box-shadow: 0px 1px 5px 3px rgba(0, 0, 0, 0.12);
  }

  .searchInput input {
    height: 55px;
    width: 100%;
    outline: none;
    border: none;
    border-radius: 5px;
    padding: 0 60px 0 20px;
    font-size: 18px;
    box-shadow: 0px 1px 5px rgba(0, 0, 0, 0.1);
  }

  .searchInput.active input {
    border-radius: 5px 5px 0 0;
  }

  .searchInput .resultBox {
    padding: 0;
    opacity: 0;
    pointer-events: none;
    max-height: 280px;
    overflow-y: auto;
  }

  .searchInput.active .resultBox {
    padding: 10px 8px;
    opacity: 1;
    pointer-events: auto;
  }

  .resultBox li {
    list-style: none;
    padding: 8px 12px;
    display: none;
    width: 100%;
    cursor: default;
    border-radius: 3px;
  }

  .searchInput.active .resultBox li {
    display: block;
  }

  .resultBox li:hover {
    background: #efefef;
  }

  .searchInput .icon {
    position: absolute;
    right: 0px;
    top: 0px;
    height: 55px;
    width: 55px;
    text-align: center;
    line-height: 55px;
    font-size: 20px;
    color: maroon;
    cursor: pointer;
  }


  .switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}

.switch input { 
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  -webkit-transition: .4s;
  transition: .4s;
}

.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  -webkit-transition: .4s;
  transition: .4s;
}

input:checked + .slider {
  background-color: #2196F3;
}

input:focus + .slider {
  box-shadow: 0 0 1px #2196F3;
}

input:checked + .slider:before {
  -webkit-transform: translateX(26px);
  -ms-transform: translateX(26px);
  transform: translateX(26px);
}

/* Rounded sliders */
.slider.round {
  border-radius: 34px;
}

.slider.round:before {
  border-radius: 50%;
}
</style>

  <script>


    url = "/suggesion_data";



    suggestions_data = []
    $.post(url).done(function (response) {


      suggestions_data = response

      let suggestions = suggestions_data;


      // getting all required elements
      const searchInput = document.querySelector(".searchInput");
      const input = searchInput.querySelector("input");
      const resultBox = searchInput.querySelector(".resultBox");
      const icon = searchInput.querySelector(".icon");
      let linkTag = searchInput.querySelector("a");
      let webLink;

      // if user press any key and release

      input.onkeyup = (e) => {
        let userData = e.target.value; //user enetered data
        let emptyArray = [];
        if (userData) {
          emptyArray = suggestions.filter((data) => {
            //filtering array value and user characters to lowercase and return only those words which are start with user enetered chars
            return data.toLocaleLowerCase().includes(userData.toLocaleLowerCase());
          });
          emptyArray = emptyArray.map((data) => {
            // passing return data inside li tag
            return data = '<li>' + data + '</li>';
          });
          searchInput.classList.add("active"); //show autocomplete box
          showSuggestions(emptyArray);
          let allList = resultBox.querySelectorAll("li");
          for (let i = 0; i < allList.length; i++) {
            //adding onclick attribute in all li tag
            allList[i].setAttribute("onclick", "get_data(this.innerHTML)");

          }
        } else {
          searchInput.classList.remove("active"); //hide autocomplete box
        }
      }
      function showSuggestions(list) {
        let listData;

        if (!list.length) {
          userValue = inputBox.value;
          listData = '<li>' + userValue + '</li>';
        } else {
          listData = list.join('');
        }
        resultBox.innerHTML = listData;
      }



    });




  </script>

    function get_data(selected_value) {
      console.log(selected_value)
      if(selected_value === "")

    }

      $.post(url).done(function (response) {


        console.log(response);
        const searchInput = document.querySelector(".searchInput");
        searchInput.classList.remove("active"); // hide search bar
        document.getElementById('seacrch_input_box').value = selected_value

        }

        }
        check_status()

<script>
  function get_assignation(username_from_query,user_role)
  {
    
    let dropdown = $('#assigned_to');
    

    dropdown.empty();

    dropdown.append('<option selected="true" disabled value="">Choose Assignation</option>');

    dropdown.prop('selectedIndex', 0);
    
    const url = '/users?get_select_users';

    // Populate dropdown with list of provinces
    $.getJSON(url, function (data) {
      $.each(data, function (key, entry) {

        
          console.log(entry.username,username_from_query)
          if (entry.username == username_from_query)
        {
          dropdown.append($('<option selected="true"></option>').attr('value', entry.abbreviation).text(entry.username));
        }
        else 
        {
          if ( user_role == 'admin')
          {
          dropdown.append($('<option></option>').attr('value', entry.abbreviation).text(entry.username));
          }
          else
          {
            dropdown.append($('<option disabled></option>').attr('value', entry.abbreviation).text(entry.username));
          }
        }
        
      })
     

    });

  }
</script>
