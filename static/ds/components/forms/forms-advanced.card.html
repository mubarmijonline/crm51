<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--surface-card);padding:20px;margin:0}#root{width:100%}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Card, Badge, Tag, Avatar, Spinner, Icon, Divider, Kbd, Input, Textarea, Select, Checkbox, Radio, Switch, SearchField, FormField, SegmentedControl, Combobox, DateRangeField, Slider, FileUpload, Alert, Toast, Dialog, Tooltip, ProgressBar, Skeleton, EmptyState, Drawer, Popover, CommandPalette, SideNav, TopBar, Tabs, Breadcrumbs, Pagination, Menu, Stepper, Accordion, DataTable, TableToolbar, StatCard, Sparkline, KeyValueList, BarChart, Timeline, AppShell, PageHeader, Section, Grid, SplitPanel, Toolbar, MobileHeader, TabBar, ListRow, BottomSheet, MobileStat, PhoneFrame } = window.AdminDesignSystem_b1fc08;

function Demo(){const [v,setV]=React.useState('table');const [c,setC]=React.useState('acme');const [r,setR]=React.useState('Last 30 days');const [n,setN]=React.useState(400);return (
 <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'20px 28px'}}>
  <FormField label="View"><SegmentedControl value={v} onChange={setV} options={[{value:'table',label:'Table',icon:'table'},{value:'board',label:'Board',icon:'columns-3'},{value:'map',label:'Map',icon:'map'}]} /></FormField>
  <FormField label="Date range"><DateRangeField value={r} onChange={setR} width="100%" /></FormField>
  <FormField label="Customer" hint="Searchable list"><Combobox value={c} onChange={setC} options={[{value:'acme',label:'Acme Inc'},{value:'north',label:'Northwind Traders'},{value:'globex',label:'Globex Corporation'}]} /></FormField>
  <FormField label="Rate limit"><Slider value={n} min={0} max={1000} step={50} onChange={setN} valueLabel={n+' req/s'} /></FormField>
  <div style={{gridColumn:'1 / -1'}}><FileUpload accept="CSV up to 20 MB" files={[{name:'customers-august.csv',size:'1.2 MB'}]} /></div>
 </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
