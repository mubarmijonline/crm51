function Demo(){const [sheet,setSheet]=React.useState(false);const [tab,setTab]=React.useState('customers');return (
 <div style={{display:'grid',gridTemplateColumns:'300px 1fr',gap:20}}>

   <div style={{flex:1,overflowY:'auto'}}>

    <ListRow leading={<Avatar name="Northwind" square />} title="Northwind" subtitle="Growth · 34 seats" meta="$980" metaSub={<Badge tone="warning" dot>Past due</Badge>} onClick={()=>setSheet(true)} />

   <BottomSheet open={sheet} onClose={()=>setSheet(false)} title="Acme Inc" description="Enterprise · cus_4Kd91"

    <KeyValueList items={[{label:'MRR',value:'$4,200',mono:true},{label:'Owner',value:'Ahmed Diab'}]} columns={2} />
   </BottomSheet>

   <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
    <MobileStat label="MRR" value="$48.2k" delta="+6.2%" icon="dollar-sign" />

   <span style={{font:'var(--type-caption)',color:'var(--text-muted)'}}>Controls grow to 40/48px and rows to 60px below 768px; primary actions go full width.</span>

 </div>);}
