<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:20px;margin:0}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:var(--type-caption);color:var(--text-body)}.v{font:var(--weight-regular) 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style>
</head><body><div style="display:flex;height:130px;border:1px solid var(--border-hairline);border-radius:var(--radius-card);overflow:hidden;background:var(--surface-app)">
<div style="width:var(--sidebar-width);background:var(--surface-card);border-right:1px solid var(--border-hairline);display:flex;align-items:center;justify-content:center;font:var(--type-caption);color:var(--text-muted)">--sidebar-width 240</div>
<div style="flex:1;display:flex;flex-direction:column">
<div style="height:var(--topbar-height);background:var(--surface-card);border-bottom:1px solid var(--border-hairline);display:flex;align-items:center;justify-content:center;font:var(--type-caption);color:var(--text-muted)">--topbar-height 56</div>
