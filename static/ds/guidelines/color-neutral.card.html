<!-- @dsCard group="Colors" viewport="700x120" name="Neutrals" subtitle="Surfaces, borders and text; cool grey ramp" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:20px;margin:0}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:var(--type-caption);color:var(--text-body)}.v{font:var(--weight-regular) 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style>
</head><body><div class="g"><div class="sw"><div class="chip" style="background:var(--gray-0)"></div><span class="n">0</span></div><div class="sw"><div class="chip" style="background:var(--gray-25)"></div><span class="n">25</span></div><div class="sw"><div class="chip" style="background:var(--gray-50)"></div><span class="n">50</span></div><div class="sw"><div class="chip" style="background:var(--gray-100)"></div><span class="n">100</span></div><div class="sw"><div class="chip" style="background:var(--gray-200)"></div><span class="n">200</span></div><div class="sw"><div class="chip" style="background:var(--gray-300)"></div><span class="n">300</span></div><div class="sw"><div class="chip" style="background:var(--gray-400)"></div><span class="n">400</span></div><div class="sw"><div class="chip" style="background:var(--gray-500)"></div><span class="n">500</span></div><div class="sw"><div class="chip" style="background:var(--gray-600)"></div><span class="n">600</span></div><div class="sw"><div class="chip" style="background:var(--gray-700)"></div><span class="n">700</span></div><div class="sw"><div class="chip" style="background:var(--gray-800)"></div><span class="n">800</span></div><div class="sw"><div class="chip" style="background:var(--gray-900)"></div><span class="n">900</span></div></div></body></html>
