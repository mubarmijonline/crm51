<!-- @dsCard group="Spacing" viewport="700x260" name="Desktop vs mobile shell" subtitle="Rail + top bar above 768; header + tab bar below" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:20px;margin:0}.n{font:var(--type-caption);color:var(--text-body)}.v{font:var(--weight-regular) 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style>
</head><body><div style="display:grid;grid-template-columns:1fr 200px;gap:16px;align-items:start">
<div style="height:220px;display:flex;border:1px solid var(--border-hairline);border-radius:var(--radius-card);overflow:hidden;background:var(--surface-app)">
 <div style="width:120px;background:var(--surface-card);border-right:1px solid var(--border-hairline);display:flex;flex-direction:column;gap:6px;padding:10px">
  <div style="height:22px;border-radius:4px;background:var(--surface-sunken)"></div><div style="height:22px;border-radius:4px;background:var(--surface-selected)"></div><div style="height:22px;border-radius:4px;background:var(--surface-sunken)"></div><div style="height:22px;border-radius:4px;background:var(--surface-sunken)"></div>
 </div>
 <div style="flex:1;display:flex;flex-direction:column">
  <div style="height:40px;background:var(--surface-card);border-bottom:1px solid var(--border-hairline)"></div>
  <div style="flex:1;padding:14px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:44px 1fr;gap:8px">
   <div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:6px"></div><div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:6px"></div><div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:6px"></div><div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:6px"></div>
   <div style="grid-column:1 / -1;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:6px"></div>
  </div>
 </div>
</div>
<div style="height:220px;display:flex;flex-direction:column;border:1px solid var(--border-hairline);border-radius:var(--radius-card);overflow:hidden;background:var(--surface-app)">
 <div style="height:44px;background:var(--surface-card);border-bottom:1px solid var(--border-hairline)"></div>
 <div style="flex:1;padding:10px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:36px;gap:8px">
  <div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:6px"></div><div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:6px"></div><div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:6px"></div><div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:6px"></div>
  <div style="grid-column:1 / -1;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:6px;height:60px"></div>
 </div>
 <div style="height:40px;background:var(--surface-card);border-top:1px solid var(--border-hairline);display:flex">
  <div style="flex:1;display:flex;align-items:center;justify-content:center"><div style="width:16px;height:16px;border-radius:4px;background:var(--action-primary)"></div></div><div style="flex:1;display:flex;align-items:center;justify-content:center"><div style="width:16px;height:16px;border-radius:4px;background:var(--gray-300)"></div></div><div style="flex:1;display:flex;align-items:center;justify-content:center"><div style="width:16px;height:16px;border-radius:4px;background:var(--gray-300)"></div></div><div style="flex:1;display:flex;align-items:center;justify-content:center"><div style="width:16px;height:16px;border-radius:4px;background:var(--gray-300)"></div></div>
 </div>
</div></div></body></html>
