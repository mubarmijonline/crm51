<!-- @dsCard group="Colors" viewport="700x160" name="Status" subtitle="Success, warning, danger, info — tint / text / border trio" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:20px;margin:0}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:var(--type-caption);color:var(--text-body)}.v{font:var(--weight-regular) 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
<div class="sw"><div class="chip" style="background:var(--status-success-bg);border:1px solid var(--status-success-border);display:flex;align-items:center;justify-content:center;font:var(--weight-medium) 12px/1 var(--font-sans);color:var(--status-success-fg)">success</div><span class="v">--status-success-bg</span></div><div class="sw"><div class="chip" style="background:var(--status-warning-bg);border:1px solid var(--status-warning-border);display:flex;align-items:center;justify-content:center;font:var(--weight-medium) 12px/1 var(--font-sans);color:var(--status-warning-fg)">warning</div><span class="v">--status-warning-bg</span></div><div class="sw"><div class="chip" style="background:var(--status-danger-bg);border:1px solid var(--status-danger-border);display:flex;align-items:center;justify-content:center;font:var(--weight-medium) 12px/1 var(--font-sans);color:var(--status-danger-fg)">danger</div><span class="v">--status-danger-bg</span></div><div class="sw"><div class="chip" style="background:var(--status-info-bg);border:1px solid var(--status-info-border);display:flex;align-items:center;justify-content:center;font:var(--weight-medium) 12px/1 var(--font-sans);color:var(--status-info-fg)">info</div><span class="v">--status-info-bg</span></div><div class="sw"><div class="chip" style="background:var(--status-neutral-bg);border:1px solid var(--status-neutral-border);display:flex;align-items:center;justify-content:center;font:var(--weight-medium) 12px/1 var(--font-sans);color:var(--status-neutral-fg)">neutral</div><span class="v">--status-neutral-bg</span></div></div></body></html>
