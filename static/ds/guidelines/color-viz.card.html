<!-- @dsCard group="Colors" viewport="700x120" name="Data visualization" subtitle="Six-step categorical ramp, in order" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:20px;margin:0}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:var(--type-caption);color:var(--text-body)}.v{font:var(--weight-regular) 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style>
</head><body><div class="g"><div class="sw"><div class="chip" style="background:var(--viz-1)"></div><span class="v">--viz-1</span></div><div class="sw"><div class="chip" style="background:var(--viz-2)"></div><span class="v">--viz-2</span></div><div class="sw"><div class="chip" style="background:var(--viz-3)"></div><span class="v">--viz-3</span></div><div class="sw"><div class="chip" style="background:var(--viz-4)"></div><span class="v">--viz-4</span></div><div class="sw"><div class="chip" style="background:var(--viz-5)"></div><span class="v">--viz-5</span></div><div class="sw"><div class="chip" style="background:var(--viz-6)"></div><span class="v">--viz-6</span></div></div></body></html>
