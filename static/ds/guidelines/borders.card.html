<!-- @dsCard group="Brand" viewport="700x130" name="Borders" subtitle="1px hairline everywhere; strong only on controls" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:20px;margin:0}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:var(--type-caption);color:var(--text-body)}.v{font:var(--weight-regular) 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style>
</head><body><div class="g"><div class="sw"><div style="height:52px;border:1px solid var(--border-hairline);border-radius:var(--radius-sm);background:var(--surface-card)"></div><span class="n">hairline</span><span class="v">cards, table rows, dividers</span></div><div class="sw"><div style="height:52px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-card)"></div><span class="n">strong</span><span class="v">inputs, secondary buttons</span></div><div class="sw"><div style="height:52px;border:1px solid var(--border-focus);border-radius:var(--radius-sm);background:var(--surface-card)"></div><span class="n">focus</span><span class="v">focused control</span></div><div class="sw"><div style="height:52px;border:1px solid var(--border-danger);border-radius:var(--radius-sm);background:var(--surface-card)"></div><span class="n">danger</span><span class="v">invalid control</span></div></div></body></html>
