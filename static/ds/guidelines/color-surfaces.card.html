<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="App, card, sunken, selected, inverse" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:20px;margin:0}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:var(--type-caption);color:var(--text-body)}.v{font:var(--weight-regular) 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
<div class="sw"><div class="chip" style="background:var(--surface-app);border:1px solid var(--border-hairline);height:62px"></div><span class="n">app</span><span class="v">--surface-app</span></div><div class="sw"><div class="chip" style="background:var(--surface-card);border:1px solid var(--border-hairline);height:62px"></div><span class="n">card</span><span class="v">--surface-card</span></div><div class="sw"><div class="chip" style="background:var(--surface-sunken);border:1px solid var(--border-hairline);height:62px"></div><span class="n">sunken</span><span class="v">--surface-sunken</span></div><div class="sw"><div class="chip" style="background:var(--surface-selected);border:1px solid var(--border-hairline);height:62px"></div><span class="n">selected</span><span class="v">--surface-selected</span></div><div class="sw"><div class="chip" style="background:var(--surface-inverse);border:1px solid var(--border-hairline);height:62px"></div><span class="n">inverse</span><span class="v">--surface-inverse</span></div></div></body></html>
