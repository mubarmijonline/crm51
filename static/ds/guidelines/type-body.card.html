<!-- @dsCard group="Type" viewport="700x170" name="Body & labels" subtitle="14px default, 13px dense, 12px captions" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:20px;margin:0}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:var(--type-caption);color:var(--text-body)}.v{font:var(--weight-regular) 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style>
</head><body><div style="display:flex;flex-direction:column;gap:10px;max-width:520px">
<p style="font:var(--type-body)">Body 14px — the default for tables, forms and prose inside the admin shell.</p>
<p style="font:var(--type-body-sm);color:var(--text-body)">Body small 13px — dense tables and secondary panels.</p>
<p style="font:var(--type-label)">Label 13px medium — field labels and toolbar text.</p>
<p style="font:var(--type-caption);color:var(--text-muted)">Caption 12px — hints, timestamps, helper copy.</p>
<p style="font:var(--type-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)">Overline 11px — column headers, nav groups</p></div></body></html>
