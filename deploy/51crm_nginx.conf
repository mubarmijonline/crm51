# 51crm — 51crm.mubarmijonline.com
#
# Install:
#   sudo ln -sf /projects/51_apps/51_american_crm_nginx_clone/deploy/51crm_nginx.conf /etc/nginx/sites-enabled/51crm
#   sudo nginx -t && sudo systemctl reload nginx
#
# Two HTTPS entry points onto the same app:
#   :443              through the CDN proxy (the DNS record is proxied)
#   :4000   straight to this origin, bypassing the proxy. The proxy
#                     cannot forward a non-standard port, so this route only
#                     works against the origin address directly — and it needs
#                     4000 open in the cloud VPC firewall.
#
# Certificate: /etc/nginx/certs/elamal.pem (SAN *.mubarmijonline.com,mubarmijonline.com, valid to Feb 16 15:12:00 2037 GMT).

upstream 51crm {
    server 127.0.0.1:4001 fail_timeout=0;
    keepalive 16;
}

# --- HTTPS through the proxy --------------------------------------------------
server {
    # No http2 parameter here on purpose. Protocol options belong to the socket,
    # and whichever server block opens 0.0.0.0:443 first already set it; repeating
    # it only earns a "protocol options redefined" warning. Port 4000
    # below is ours alone, so it does declare http2.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 51crm.mubarmijonline.com;

    ssl_certificate     /etc/nginx/certs/elamal.pem;
    ssl_certificate_key /etc/nginx/certs/elamal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:51crmTLS:2m;
    ssl_session_timeout 1h;

    # Restore the real client address from the proxy's header. Only safe here,
    # where every request genuinely arrives via the proxy.
    include /projects/51_apps/51_american_crm_nginx_clone/deploy/51crm_realip.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    include /projects/51_apps/51_american_crm_nginx_clone/deploy/51crm_locations.conf;
}

# --- HTTPS direct on 4000 -------------------------------------------
server {
    listen 4000 ssl http2;
    listen [::]:4000 ssl http2;
    server_name 51crm.mubarmijonline.com 34.55.212.155 _;

    ssl_certificate     /etc/nginx/certs/elamal.pem;
    ssl_certificate_key /etc/nginx/certs/elamal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:51crmTLS4000:2m;
    ssl_session_timeout 1h;

    # Deliberately no real_ip here: traffic on this port arrives straight from
    # the client, so $remote_addr is already correct. Trusting a forwarded-for
    # header on an unproxied port would let a caller spoof its own address and
    # walk past the login rate limit.

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    include /projects/51_apps/51_american_crm_nginx_clone/deploy/51crm_locations.conf;
}

# --- plain HTTP redirects to HTTPS --------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name 51crm.mubarmijonline.com;
    return 301 https://51crm.mubarmijonline.com$request_uri;
}
